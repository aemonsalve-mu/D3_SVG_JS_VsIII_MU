<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Cómo se mide una figura SVG</title><desc id="descripcion">Ejemplo en unidades internas; el ancho visible en pantalla puede ser distinto.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#173e3b"/></marker></defs><rect width="900" height="540" rx="12" fill="#f3f6f1"/><g font-family="Arial,sans-serif" fill="#173e3b"><text x="30" y="38" font-size="25" font-weight="bold">Cómo se mide una figura SVG</text><text x="30" y="67" font-size="17">Ejemplo en unidades internas; el ancho visible en pantalla puede ser distinto.</text><rect x="100" y="125" width="600" height="300" fill="white" stroke="#9fb7ac"/><line x1="100" y1="125" x2="755" y2="125" stroke="#173e3b" stroke-width="2" marker-end="url(#flecha)"/><line x1="100" y1="125" x2="100" y2="463" stroke="#173e3b" stroke-width="2" marker-end="url(#flecha)"/><text x="38" y="110" font-size="18">(0, 0)</text><text x="770" y="130" font-size="18">x aumenta</text><text x="115" y="465" font-size="18">y aumenta hacia abajo</text><rect x="220" y="205" width="240" height="120" fill="#8bd0b7" stroke="#00766d" stroke-width="2"/><line x1="100" y1="205" x2="220" y2="205" stroke="#173e3b" stroke-width="2" stroke-dasharray="5 5"/><line x1="220" y1="125" x2="220" y2="205" stroke="#173e3b" stroke-width="2" stroke-dasharray="5 5"/><text x="136" y="195" font-size="18">x = 120</text><text x="230" y="170" font-size="18">y = 80</text><line x1="220" y1="350" x2="460" y2="350" stroke="#173e3b" stroke-width="2" marker-end="url(#flecha)"/><text x="262" y="377" font-size="18">width = 240</text><line x1="485" y1="205" x2="485" y2="325" stroke="#173e3b" stroke-width="2" marker-end="url(#flecha)"/><text x="505" y="270" font-size="18">height = 120</text><text x="30" y="510" font-size="20">Posición (x, y) y tamaño (width, height) son medidas diferentes.</text></g></svg>