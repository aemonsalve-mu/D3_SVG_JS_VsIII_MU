<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="titulo descripcion"><title id="titulo">De un vector de datos a longitudes</title><desc id="descripcion">El dato 100 se transforma en 400 unidades; 50 en 200 y 20 en 80.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#173e3b"/></marker></defs><rect width="900" height="540" rx="12" fill="#f3f6f1"/><g font-family="Arial,sans-serif" fill="#173e3b"><text x="30" y="38" font-size="25" font-weight="bold">De un vector de datos a longitudes</text><text x="30" y="67" font-size="17">El dato 100 se transforma en 400 unidades; 50 en 200 y 20 en 80.</text><text x="35" y="115" font-size="21">Datos: [20, 50, 100]</text><text x="35" y="151" font-size="20">domain([0, 100])</text><text x="35" y="184" font-size="20">range([0, 400])</text><text x="35" y="226" font-size="20">salida = dato × 4</text><text x="360" y="140" font-size="18">20</text><rect x="410" y="115" width="80" height="35" fill="#00766d"/><text x="500" y="140" font-size="17">80</text><text x="360" y="230" font-size="18">50</text><rect x="410" y="205" width="200" height="35" fill="#00766d"/><text x="620" y="230" font-size="17">200</text><text x="360" y="320" font-size="18">100</text><rect x="410" y="295" width="400" height="35" fill="#00766d"/><text x="820" y="320" font-size="17">400</text><text x="35" y="425" font-size="21">data(datos) reparte un valor por figura.</text><text x="35" y="461" font-size="21">width = escala(d) convierte cada dato en una longitud.</text><text x="35" y="504" font-size="19">La escala calcula números; attr aplica esos números al dibujo.</text></g></svg>