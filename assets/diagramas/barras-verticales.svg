<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Por qué y y height se calculan por separado</title><desc id="descripcion">El eje y de SVG aumenta hacia abajo, aunque el dato representado crezca hacia arriba.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#173e3b"/></marker></defs><rect width="900" height="540" rx="12" fill="#f3f6f1"/><g font-family="Arial,sans-serif" fill="#173e3b"><text x="30" y="38" font-size="25" font-weight="bold">Por qué y y height se calculan por separado</text><text x="30" y="67" font-size="17">El eje y de SVG aumenta hacia abajo, aunque el dato representado crezca hacia arriba.</text><text x="35" y="115" font-size="20">SVG de 500 × 300; margen = 40</text><text x="35" y="150" font-size="19">base = alto − margen = 260</text><text x="35" y="190" font-size="19">escalaY.domain([0, 100])</text><text x="35" y="225" font-size="19">escalaY.range([260, 40])</text><text x="35" y="280" font-size="21">Para dato = 75:</text><text x="35" y="315" font-size="20">y = escalaY(75) = 95</text><text x="35" y="350" font-size="20">height = 260 − 95 = 165</text><rect x="460" y="120" width="400" height="240" fill="white" stroke="#9fb7ac"/>
<line x1="492" y1="152" x2="492" y2="328" stroke="#173e3b" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="492" y1="328" x2="828" y2="328" stroke="#173e3b" stroke-width="2"/>
<line x1="492" y1="152" x2="828" y2="152" stroke="#173e3b" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="580" y="196" width="72" height="132" fill="#00766d"/>
<line x1="492" y1="196" x2="580" y2="196" stroke="#173e3b" stroke-width="2" stroke-dasharray="5 5"/>
<text x="500" y="187" font-size="17">y = 95</text><text x="500" y="145" font-size="17">y = 40</text>
<text x="500" y="350" font-size="17">base: y = 260</text>
<line x1="700" y1="196" x2="700" y2="328" stroke="#173e3b" stroke-width="2" marker-end="url(#flecha)"/>
<text x="718" y="270" font-size="17">height = 165</text><text x="35" y="465" font-size="20">El dato grande sube en el gráfico: su coordenada y es menor.</text><text x="35" y="505" font-size="20">height es una longitud positiva; y es la posición superior.</text></g></svg>