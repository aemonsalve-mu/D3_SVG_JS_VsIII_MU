<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Qué significa cada posición del vector</title><desc id="descripcion">Los índices de JavaScript empiezan en 0.</desc><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#173e3b"/></marker></defs><rect width="900" height="540" rx="12" fill="#f3f6f1"/><g font-family="Arial,sans-serif" fill="#173e3b"><text x="30" y="38" font-size="25" font-weight="bold">Qué significa cada posición del vector</text><text x="30" y="67" font-size="17">Los índices de JavaScript empiezan en 0.</text><text x="35" y="120" font-size="22">dimensiones = [600, 240]</text><text x="35" y="155" font-size="19">ancho = dimensiones[0] → 600</text><text x="35" y="185" font-size="19">alto = dimensiones[1] → 240</text><text x="35" y="240" font-size="22">viewBox=&quot;0 0 600 240&quot;</text><text x="35" y="280" font-size="19">[mínimo x, mínimo y, ancho, alto]</text><text x="470" y="120" font-size="20">medidas = [[60, 40], [120, 80]]</text><rect x="490" y="170" width="60" height="40" fill="#00766d"/><rect x="650" y="170" width="120" height="80" fill="#00766d"/><text x="470" y="292" font-size="19">Primera figura: d = [60, 40]</text><text x="470" y="325" font-size="19">d[0] → width = 60</text><text x="470" y="356" font-size="19">d[1] → height = 40</text><text x="35" y="430" font-size="20">Un array no indica por sí solo qué mide: tú defines su significado.</text><text x="35" y="472" font-size="20">[ancho, alto] no es lo mismo que [x, y] ni que [mínimo, máximo].</text></g></svg>