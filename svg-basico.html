<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML básico con SVG</title>
</head>
<body>
  <h1>Mi primer SVG</h1>
  <!-- No necesita D3 ni JavaScript. -->
  <svg viewBox="0 0 500 180" style="width:100%;max-width:600px" role="img" aria-labelledby="titulo">
    <title id="titulo">Un círculo verde</title>
    <circle cx="100" cy="90" r="50" fill="teal"/>
  </svg>
</body>
</html>
